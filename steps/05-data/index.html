<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园图书屋 · 数据驱动版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">校园图书屋</a>
    <nav class="site-nav">
      <a href="#search">检索</a>
      <a href="#books">新书</a>
      <a href="#about">关于</a>
    </nav>
    <div class="header-tools">
      <button id="modeBtn" class="mode-btn" type="button">🌙 暗色</button>
      <span id="cart" class="cart">购物车 (0)</span>
    </div>
  </header>

  <main>
    <section class="search-bar" id="search">
      <!-- 第 5 次课：搜索改由 input 事件实时过滤，表单只保留回车提交的语义 -->
      <form id="searchForm" action="/search" method="get">
        <label for="kw">书名关键字</label>
        <input type="text" id="kw" name="kw" placeholder="输入书名，如：计算机">
        <label for="type">图书分类</label>
        <select id="type" name="type">
          <option>全部</option>
          <option>计算机</option>
          <option>文学</option>
        </select>
        <button type="submit">检索</button>
      </form>
    </section>

    <section class="book-area" id="books">
      <h2>新书推荐</h2>
      <!-- 手写卡片已删除：这里只留空容器，内容由 books 数组渲染 -->
      <div class="book-list" id="bookList"></div>
    </section>

    <aside id="about">
      <section class="side-panel">
        <h3>分类导航</h3>
        <ul>
          <li>计算机</li>
          <li>文学</li>
          <li>历史</li>
          <li>经济管理</li>
        </ul>
      </section>
      <section class="side-panel">
        <h3>本周热榜</h3>
        <ol>
          <li>深入理解计算机系统</li>
          <li>Python 编程从入门到实践</li>
          <li>西游记</li>
          <li>设计模式</li>
        </ol>
      </section>
      <section class="side-panel">
        <h3>借阅须知</h3>
        <p>凭校园卡借阅，每人限借 5 本，借期 30 天。</p>
      </section>
    </aside>
  </main>

  <button id="topBtn" class="to-top" type="button" title="回到顶部">↑</button>

  <footer>
    <p>版权所有 © 2026 校园图书屋</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
